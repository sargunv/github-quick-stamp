name: Release

# Push a tag matching package.json's version (e.g. v0.2.0) to build the zips,
# attach them to a GitHub release, and submit them to the stores. Each store is
# skipped until its secrets are configured.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          cache: true
      - name: Tag matches package.json version
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Formatters and linters
        run: mise run check
      - name: Build Chrome and Firefox zips
        run: mise run zip
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" .output/*.zip --generate-notes
      - name: Submit to stores
        env:
          # Chrome Web Store: either the OAuth refresh token set (API v1.1) or
          # the service account set with CHROME_API_VERSION=v2.
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
          CHROME_API_VERSION: ${{ secrets.CHROME_API_VERSION }}
          CHROME_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
          CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL: ${{ secrets.CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL }}
          CHROME_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.CHROME_SERVICE_ACCOUNT_PRIVATE_KEY }}
          # addons.mozilla.org: the gecko ID from wxt.config.ts.
          FIREFOX_EXTENSION_ID: quick-stamp@sargunv.github.io
          FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
          FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}
        run: |
          # Missing secrets arrive as empty strings; unset them so they don't
          # fail the submit tool's validation.
          for var in $(env | grep -oE '^(CHROME|FIREFOX)_[A-Z_]+'); do
            [ -n "${!var}" ] || unset "$var"
          done
          args=()
          if [ -n "${CHROME_EXTENSION_ID:-}" ]; then
            args+=(--chrome-zip ".output/github-quick-stamp-$VERSION-chrome.zip")
          else
            echo "::notice::Skipping Chrome Web Store: CHROME_EXTENSION_ID not set"
          fi
          if [ -n "${FIREFOX_JWT_ISSUER:-}" ]; then
            args+=(
              --firefox-zip ".output/github-quick-stamp-$VERSION-firefox.zip"
              --firefox-sources-zip ".output/github-quick-stamp-$VERSION-sources.zip"
            )
          else
            echo "::notice::Skipping addons.mozilla.org: FIREFOX_JWT_ISSUER not set"
          fi
          if [ ${#args[@]} -gt 0 ]; then
            pnpm exec wxt submit "${args[@]}"
          fi
