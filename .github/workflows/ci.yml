name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          cache: true
      - name: Formatters and linters
        run: mise run check
      - name: Build Chrome and Firefox zips
        run: mise run zip
      - uses: actions/upload-artifact@v7
        with:
          name: extension-zips
          path: .output/*.zip
